services:
  reverse-proxy:
    image: traefik:v3.6.1
    expose:
      - "8080"
    ports:
      - "80:80"
    command:
      - --api.insecure=true
      - --providers.docker
      - --entryPoints.web.address=:80
      - --providers.docker.exposedbydefault=false
      #- --log.level=DEBUG
    labels:
      - "traefik.enable=true"
      - "traefik.port=8080"
      - "traefik.http.routers.traefik.rule=Host(`traefik.workadventure.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        aliases:
          - "front.workadventure.localhost"
          - "play.workadventure.localhost"
          - "room-api.workadventure.localhost"
          - "maps.workadventure.localhost"
          - "oidc.workadventure.localhost"
          - "map-storage.workadventure.localhost"
          - "xmpp.workadventure.localhost"
          - "matrix.workadventure.localhost"
          - "pusher.workadventure.localhost"
          - "mcp.workadventure.localhost"

  node-modules-init:
    image: ghcr.io/thecodingmachine/nodejs:v2-24-trixie
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /usr/src/app/node_modules"]
    volumes:
      - workadventure-linux-node-modules:/usr/src/app/node_modules

  # The browser never talks to this service directly. Play authenticates users,
  # replaces their identity with an opaque owner ID, and proxies bridge calls.
  teapot-agent-bridge:
    build:
      context: .
      dockerfile: teapot-cli-companion/Dockerfile
    image: teapot-agent-bridge:development
    init: true
    environment:
      TEAPOT_AGENT_BRIDGE_SECRET: "${TEAPOT_AGENT_BRIDGE_SECRET:-development-only-teapot-agent-bridge-secret-change-me}"
      TEAPOT_AGENT_BRIDGE_HOST: "0.0.0.0"
      TEAPOT_AGENT_BRIDGE_PORT: "17375"
      TEAPOT_AGENT_AUTH_ROOT: "/var/lib/teapot-agent-auth"
      TEAPOT_HOSTED_BRIDGE_SECRET: "${TEAPOT_AGENT_BRIDGE_SECRET:-development-only-teapot-agent-bridge-secret-change-me}"
      TEAPOT_HOSTED_BRIDGE_HOST: "0.0.0.0"
      TEAPOT_HOSTED_BRIDGE_PORT: "17375"
      TEAPOT_CODEX_BRIDGE_SERVICE_SECRET: "${TEAPOT_AGENT_BRIDGE_SECRET:-development-only-teapot-agent-bridge-secret-change-me}"
      TEAPOT_CODEX_BRIDGE_HOST: "0.0.0.0"
      TEAPOT_CODEX_BRIDGE_PORT: "17375"
      TEAPOT_CODEX_AUTH_ROOT: "/var/lib/teapot-agent-auth/codex"
      TEAPOT_CLAUDE_AUTH_ROOT: "/var/lib/teapot-agent-auth/claude"
      TEAPOT_CLAUDE_CLI: "claude"
    volumes:
      - teapot-agent-auth:/var/lib/teapot-agent-auth
    expose:
      - "17375"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:17375/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  play:
    image: ghcr.io/thecodingmachine/nodejs:v2-24-trixie
    # Static type and Svelte checks run in the host validation suite. Keeping
    # them out of the long-lived container avoids watch-process OOM exits.
    command: npm run dev-docker
    # Uncomment to run the production build in dev (along STARTUP_COMMAND_4 and NODE_OPTIONS)
    #command: npm run start
    working_dir: /usr/src/app/play
    volumes:
      - .:/usr/src/app
      - workadventure-linux-node-modules:/usr/src/app/node_modules
    tmpfs: /tmp
    ports:
      - "9231:9229"
      - "9235:9235"
    depends_on:
      node-modules-init:
        condition: service_completed_successfully
      teapot-postgres:
        condition: service_healthy
      teapot-agent-bridge:
        condition: service_healthy
    environment:
      # On startup, we ask the messages container to regenerate the files.
      # Note: we need to use this "messages" container because of ARM64 processors that are not supported with protoc (used in "messages" container)
      STARTUP_COMMAND_1: ../wait-proto.sh
      STARTUP_COMMAND_2: ../npm-install.sh
      STARTUP_COMMAND_3: npm run typesafe-i18n
      # Uncomment to run the production build in dev
      #STARTUP_COMMAND_4: npm run build
      #STARTUP_COMMAND_5: npm run build-iframe-api
      #NODE_OPTIONS: --max-old-space-size=16384
      DEBUG: "socket,space"
      DEBUG_COLORS: "true"
      DEBUG_ERROR_MESSAGES: "true"
      DEBUG_MODE: "$DEBUG_MODE"
      JITSI_URL: $JITSI_URL
      JITSI_PRIVATE_MODE: "$JITSI_PRIVATE_MODE"
      ENABLE_MAP_EDITOR: "$ENABLE_MAP_EDITOR"
      HOST: "0.0.0.0"
      NODE_ENV: development
      ALLOWED_CORS_ORIGIN: "http://play.workadventure.localhost"
      PUSHER_URL: http://play.workadventure.localhost
      FRONT_URL: http://play.workadventure.localhost
      BRAND_NAME: "${BRAND_NAME:-tpot.world}"
      BRAND_SHORT_NAME: "${BRAND_SHORT_NAME:-tpot}"
      BRAND_DESCRIPTION: "${BRAND_DESCRIPTION:-Organize your online world in tpot.world.}"
      BRAND_AUTHOR: "${BRAND_AUTHOR:-tpot.world team}"
      BRAND_PROVIDER: "${BRAND_PROVIDER:-tpot.world}"
      BRAND_THEME_COLOR: "${BRAND_THEME_COLOR:-#1B2A41}"
      BRAND_WEBSITE_URL: "${BRAND_WEBSITE_URL:-}"
      BRAND_LOGO_URL: "${BRAND_LOGO_URL:-}"
      BRAND_LOADING_LOGO_URL: "${BRAND_LOADING_LOGO_URL:-}"
      BRAND_LOGIN_LOGO_URL: "${BRAND_LOGIN_LOGO_URL:-}"
      BRAND_ERROR_LOGO_URL: "${BRAND_ERROR_LOGO_URL:-}"
      BRAND_ERROR_IMAGE_URL: "${BRAND_ERROR_IMAGE_URL:-}"
      BRAND_LOADING_BACKGROUND_URL: "${BRAND_LOADING_BACKGROUND_URL:-}"
      BRAND_PWA_BACKGROUND_URL: "${BRAND_PWA_BACKGROUND_URL:-}"
      BRAND_POWERED_BY_LOGO_URL: "${BRAND_POWERED_BY_LOGO_URL:-}"
      BRAND_STATUS_ICON_URL: "${BRAND_STATUS_ICON_URL:-}"
      BRAND_STATUS_CHARACTER_URL: "${BRAND_STATUS_CHARACTER_URL:-}"
      BRAND_STATUS_FONT_IMAGE_URL: "${BRAND_STATUS_FONT_IMAGE_URL:-}"
      BRAND_STATUS_FONT_DATA_URL: "${BRAND_STATUS_FONT_DATA_URL:-}"
      BRAND_FAVICON_URL: "${BRAND_FAVICON_URL:-}"
      BRAND_MANIFEST_ICON_URL: "${BRAND_MANIFEST_ICON_URL:-}"
      BRAND_CARD_IMAGE_URL: "${BRAND_CARD_IMAGE_URL:-}"
      UPLOADER_URL: http://uploader.workadventure.localhost
      ICON_URL: http://icon.workadventure.localhost
      STUN_SERVER: "${STUN_SERVER:-}"
      TURN_SERVER: "${TURN_SERVER:-}"
      DISABLE_NOTIFICATIONS: "$DISABLE_NOTIFICATIONS"
      SKIP_RENDER_OPTIMIZATIONS: "$SKIP_RENDER_OPTIMIZATIONS"
      # Use TURN_USER/TURN_PASSWORD if your Coturn server is secured via hard coded credentials.
      # Advice: you should instead use Coturn with short-lived secrets thanks to TURN_STATIC_AUTH_SECRET
      TURN_USER: ""
      TURN_PASSWORD: ""
      TURN_STATIC_AUTH_SECRET: "$TURN_STATIC_AUTH_SECRET"
      MAX_PER_GROUP: "$MAX_PER_GROUP"
      MAX_USERNAME_LENGTH: "$MAX_USERNAME_LENGTH"
      OPENID_CLIENT_ID: authorization-code-client-id
      OPENID_CLIENT_SECRET: authorization-code-client-secret
      OPENID_CLIENT_ISSUER: http://oidc.workadventure.localhost
      OPENID_PROFILE_SCREEN_PROVIDER: ${OPENID_PROFILE_SCREEN_PROVIDER:-}
      OPENID_SCOPE: profile openid email tags-scope
      OPENID_PROMPT: ${OPENID_PROMPT:-}
      OPENID_USERNAME_CLAIM: ${OPENID_USERNAME_CLAIM:-}
      OPENID_LOCALE_CLAIM: ${OPENID_LOCALE_CLAIM:-}
      OPENID_LOGOUT_REDIRECT_URL: "${OPENID_LOGOUT_REDIRECT_URL:-}"

      # Keep the local stack bootable without a hand-created `.env`. Production
      # overrides this through its own deployment environment.
      SECRET_KEY: "${SECRET_KEY:-yourSecretKey2020}"
      TEAPOT_DATABASE_URL: "postgresql://teapot:teapot@teapot-postgres:5432/teapot"
      TEAPOT_REQUIRE_PERSISTENCE: "true"
      TEAPOT_MAP_STORAGE_WRITE_TOKEN: "123"
      TEAPOT_MCP_PUBLIC_URL: "http://mcp.workadventure.localhost/mcp"
      # Development-only default. Production requires an explicit secret in
      # contrib/docker/docker-compose.teapot.yaml.
      TEAPOT_MCP_APPROVAL_SECRET: "${TEAPOT_MCP_APPROVAL_SECRET:-development-only-teapot-mcp-approval-secret-change-me}"
      TEAPOT_AGENT_BRIDGE_URL: "http://teapot-agent-bridge:17375"
      TEAPOT_AGENT_BRIDGE_SECRET: "${TEAPOT_AGENT_BRIDGE_SECRET:-development-only-teapot-agent-bridge-secret-change-me}"
      # Keep generated development assets on the bind-mounted workspace so
      # the non-root Node container can create them and they survive restarts.
      TEAPOT_WOKA_STORAGE_DIRECTORY: "/usr/src/app/.teapot-data/wokas"
      TEAPOT_WOKA_PUBLIC_BASE_URL: "http://play.workadventure.localhost"
      TEAPOT_X_CLIENT_ID: "${TEAPOT_X_CLIENT_ID:-}"
      TEAPOT_X_CLIENT_SECRET: "${TEAPOT_X_CLIENT_SECRET:-}"
      TEAPOT_X_REDIRECT_URI: "${TEAPOT_X_REDIRECT_URI:-}"
      TEAPOT_X_BOOTSTRAP_USER_IDS: "${TEAPOT_X_BOOTSTRAP_USER_IDS:-}"
      ADMIN_API_URL: "${ADMIN_API_URL:-}"
      ADMIN_API_TOKEN: "$ADMIN_API_TOKEN"
      MAP_STORAGE_API_TOKEN: "FFVSGBSGBSGFB23SFGBSFG4BS"
      API_URL: back:50051
      DISABLE_ANONYMOUS: $DISABLE_ANONYMOUS
      #Map editor
      PUBLIC_MAP_STORAGE_URL: "http://map-storage.workadventure.localhost"
      INTERNAL_MAP_STORAGE_URL: "http://map-storage:3000"
      REDIS_HOST: redis
      ENABLE_OPENAPI_ENDPOINT: "true"
      START_ROOM_URL: "$START_ROOM_URL"
      ENABLE_CHAT: "$ENABLE_CHAT"
      ENABLE_CHAT_UPLOAD: "$ENABLE_CHAT_UPLOAD"
      ENABLE_CHAT_ONLINE_LIST: "$ENABLE_CHAT_ONLINE_LIST"
      ENABLE_CHAT_DISCONNECTED_LIST: "$ENABLE_CHAT_DISCONNECTED_LIST"
      CLIENT_DISCONNECTION_RETENTION_MS: "$CLIENT_DISCONNECTION_RETENTION_MS"
      PUSHER_ADMIN_WS_MAX_BACKPRESSURE_BYTES: "$PUSHER_ADMIN_WS_MAX_BACKPRESSURE_BYTES"
      ENABLE_TUTORIAL: "$ENABLE_TUTORIAL"
      # Woka settings
      DEFAULT_WOKA_NAME: ${DEFAULT_WOKA_NAME:-}
      DEFAULT_WOKA_TEXTURE: ${DEFAULT_WOKA_TEXTURE:-}
      SKIP_CAMERA_PAGE: ${SKIP_CAMERA_PAGE:-false}
      BYPASS_PWA: ${BYPASS_PWA:-true}
      PROVIDE_DEFAULT_WOKA_NAME: ${PROVIDE_DEFAULT_WOKA_NAME:-}
      PROVIDE_DEFAULT_WOKA_TEXTURE: ${PROVIDE_DEFAULT_WOKA_TEXTURE:-}
      SERVER_NAME: $SERVER_NAME
      SERVER_MOTD: $SERVER_MOTD
      SERVER_ICON: $SERVER_ICON
      # Report issues menu
      ENABLE_REPORT_ISSUES_MENU: $ENABLE_REPORT_ISSUES_MENU
      REPORT_ISSUES_URL: $REPORT_ISSUES_URL
      # LogRocket
      LOGROCKET_ID: $LOGROCKET_ID
      # Sentry integration
      SENTRY_DSN_FRONT: ${SENTRY_DSN_FRONT:-}
      SENTRY_DSN_PUSHER: ${SENTRY_DSN_PUSHER:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      # Room API
      ROOM_API_PORT: "50051"
      ROOM_API_SECRET_KEY: ${ROOM_API_SECRET_KEY}
      #GRPC_VERBOSITY: DEBUG
      #GRPC_TRACE: all
      FEATURE_FLAG_BROADCAST_AREAS: "true"
      # Integration tools
      KLAXOON_ENABLED: "$KLAXOON_ENABLED"
      KLAXOON_CLIENT_ID: "${KLAXOON_CLIENT_ID:-}"
      YOUTUBE_ENABLED: "$YOUTUBE_ENABLED"
      GOOGLE_DRIVE_ENABLED: "$GOOGLE_DRIVE_ENABLED"
      GOOGLE_DOCS_ENABLED: "$GOOGLE_DOCS_ENABLED"
      GOOGLE_SHEETS_ENABLED: "$GOOGLE_SHEETS_ENABLED"
      GOOGLE_SLIDES_ENABLED: "$GOOGLE_SLIDES_ENABLED"
      ERASER_ENABLED: "$ERASER_ENABLED"
      EXCALIDRAW_ENABLED: "$EXCALIDRAW_ENABLED"
      EXCALIDRAW_DOMAINS: "${EXCALIDRAW_DOMAINS:-}"
      EMBEDDED_DOMAINS_WHITELIST: "${EMBEDDED_DOMAINS_WHITELIST:-}"
      CARDS_ENABLED: "$CARDS_ENABLED"
      TLDRAW_ENABLED: "$TLDRAW_ENABLED"
      # Report issues menu
      ACTIVE_REPORT_ISSUES_MENU: "true"
      URL_REPORT_ISSUES: "https://github.com/workadventure/workadventure/issues"
      # Google drive picker
      GOOGLE_DRIVE_PICKER_CLIENT_ID: "${GOOGLE_DRIVE_PICKER_CLIENT_ID:-}"
      GOOGLE_DRIVE_PICKER_APP_ID: "${GOOGLE_DRIVE_PICKER_APP_ID:-}"
      MINIMUM_DISTANCE: "${MINIMUM_DISTANCE}"
      #Chat
      MATRIX_API_URI: http://synapse:8008/
      MATRIX_PUBLIC_URI: http://matrix.workadventure.localhost
      MATRIX_ADMIN_USER: admin
      MATRIX_ADMIN_PASSWORD: MySecretPassword
      MATRIX_DOMAIN: matrix.workadventure.localhost
      # oEmbed providers
      EMBEDLY_KEY: "$EMBEDLY_KEY"
      # Map editor restrictions (controlled by .env; defaults to allowing local users)
      MAP_EDITOR_ALLOW_ALL_USERS: "$MAP_EDITOR_ALLOW_ALL_USERS"
      MAX_DISPLAYED_VIDEOS: ${MAX_DISPLAYED_VIDEOS:-}
      LIVEKIT_PIXEL_DENSITY: "${LIVEKIT_PIXEL_DENSITY:-}"

      # "selfie-segmentation" or "tasks-vision"
      # TODO: remove "selfie-segmentation" code when tasks-vision is stable enough
      BACKGROUND_TRANSFORMER_ENGINE: ${BACKGROUND_TRANSFORMER_ENGINE:-}
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.front.rule=Host(`front.workadventure.localhost`)"
      - "traefik.http.routers.front.service=front"
      - "traefik.http.services.front.loadbalancer.server.port=8080"

      # Serve Vite's dev module graph (/src, /node_modules, /@fs) same-origin under the play host
      # (instead of the pusher 303-redirecting them to front.*). Web Workers must be same-origin, so
      # without this the matrix-js-sdk IndexedDB worker fails to load cross-origin and persistence
      # falls back to the main thread. Priority 2 beats the play catch-all (priority 1); the front
      # router still wins on the front.* host via its longer (higher default priority) Host rule.
      - "traefik.http.routers.play-vite.rule=HostRegexp(`^.+$`) && (PathPrefix(`/src`) || PathPrefix(`/node_modules`) || PathPrefix(`/@fs`) || PathPrefix(`/@vite`) || PathPrefix(`/@id`))"
      - "traefik.http.routers.play-vite.priority=2"
      - "traefik.http.routers.play-vite.service=front"

      # Vite's HMR socket uses its own path so it can share the browser's
      # play.* origin without colliding with the game's /ws/ socket.
      - "traefik.http.routers.play-vite-hmr.rule=Host(`play.workadventure.localhost`) && Path(`/__vite_hmr`)"
      - "traefik.http.routers.play-vite-hmr.priority=3"
      - "traefik.http.routers.play-vite-hmr.service=front"

      - "traefik.http.routers.room-api.rule=Host(`room-api.workadventure.localhost`)"
      - "traefik.http.routers.room-api.service=room-api"
      - "traefik.http.services.room-api.loadbalancer.server.port=50051"
      - "traefik.http.services.room-api.loadbalancer.server.scheme=h2c"

      - "traefik.http.routers.play.rule=HostRegexp(`^.+$`)"
      - "traefik.http.routers.play.priority=1"
      - "traefik.http.routers.play.service=play"
      # Stable local entry point for the browser. The catch-all remains for
      # custom hosts, while this explicit rule survives proxy reloads.
      - "traefik.http.routers.play-local.rule=Host(`play.workadventure.localhost`)"
      # Keep this below the dedicated /ws/ router (priority 2), otherwise
      # clients remain stuck on the connecting screen.
      - "traefik.http.routers.play-local.priority=1"
      - "traefik.http.routers.play-local.service=play"
      - "traefik.http.services.play.loadbalancer.server.port=3000"

      - "traefik.http.routers.play-ws.rule=HostRegexp(`^.+$`) && PathPrefix(`/ws/`)"
      - "traefik.http.routers.play-ws.priority=2"
      - "traefik.http.routers.play-ws.service=play-ws"
      - "traefik.http.services.play-ws.loadbalancer.server.port=3001"
      - "traefik.http.services.play-ws.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.play-ws.loadbalancer.sticky.cookie.name=wa_ws_affinity"
      - "traefik.http.services.play-ws.loadbalancer.sticky.cookie.httpOnly=true"
      - "traefik.http.services.play-ws.loadbalancer.sticky.cookie.sameSite=lax"

  teapot-mcp:
    image: ghcr.io/thecodingmachine/nodejs:v2-24-trixie
    command: npm run start
    working_dir: /usr/src/app/teapot-mcp
    depends_on:
      play:
        condition: service_started
    environment:
      STARTUP_COMMAND_1: ../npm-install.sh
      TEAPOT_PUSHER_URL: "http://play:3000"
      TEAPOT_MCP_HOST: "0.0.0.0"
      TEAPOT_MCP_PORT: "17374"
      TEAPOT_MCP_ALLOWED_HOSTS: "mcp.workadventure.localhost,localhost:17374,127.0.0.1:17374"
    volumes:
      - .:/usr/src/app
      - workadventure-linux-node-modules:/usr/src/app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.teapot-mcp.rule=Host(`mcp.workadventure.localhost`)"
      - "traefik.http.routers.teapot-mcp.entryPoints=web"
      - "traefik.http.routers.teapot-mcp.service=teapot-mcp"
      - "traefik.http.services.teapot-mcp.loadbalancer.server.port=17374"

  maps:
    image: thecodingmachine/php:8.1-v4-apache-node12
    environment:
      DEBUG_MODE: "$DEBUG_MODE"
      HOST: "0.0.0.0"
      NODE_ENV: development
      FRONT_URL: http://play.workadventure.localhost
      #APACHE_DOCUMENT_ROOT: dist/
      #APACHE_EXTENSIONS: headers
      #APACHE_EXTENSION_HEADERS: 1
      STARTUP_COMMAND_0: sudo a2enmod headers
      STARTUP_COMMAND_1: yarn install
    volumes:
      - ./maps:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maps.rule=Host(`maps.workadventure.localhost`)"
      - "traefik.http.routers.maps.entryPoints=web,traefik"
      - "traefik.http.services.maps.loadbalancer.server.port=80"

  back:
    image: ghcr.io/thecodingmachine/nodejs:v2-24-trixie
    command: npm run dev
    working_dir: /usr/src/app/back
    depends_on:
      node-modules-init:
        condition: service_completed_successfully
    environment:
      #DEBUG: "*"
      PLAY_URL: http://play.workadventure.localhost
      MINIMUM_DISTANCE: "${MINIMUM_DISTANCE}"
      GROUP_RADIUS: "${GROUP_RADIUS}"
      # On startup, we ask the messages container to regenerate the files.
      # Note: we need to use this "messages" container because of ARM64 processors that are not supported with protoc (used in "messages" container)
      #STARTUP_COMMAND_0: touch /usr/src/app/back/src/Messages/generate_request/need_regenerate
      STARTUP_COMMAND_1: ../wait-proto.sh
      STARTUP_COMMAND_2: ../npm-install.sh
      # wait for files to be generated by "messages" container
      #STARTUP_COMMAND_2: while [ -f /usr/src/app/back/src/Messages/generate_request/need_regenerate ]; do sleep 1; done
      SECRET_KEY: "$SECRET_KEY"
      SECRET_JITSI_KEY: "$SECRET_JITSI_KEY"
      ENABLE_MAP_EDITOR: "$ENABLE_MAP_EDITOR"
      ALLOW_ARTILLERY: "true"
      ADMIN_API_URL: "${ADMIN_API_URL:-}"
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:-}"
      JITSI_URL: $JITSI_URL
      JITSI_ISS: $JITSI_ISS
      BBB_URL: $BBB_URL
      BBB_SECRET: $BBB_SECRET
      MAX_PER_GROUP: "$MAX_PER_GROUP"
      REDIS_HOST: redis
      NODE_ENV: development
      STORE_VARIABLES_FOR_LOCAL_MAPS: "true"
      PROMETHEUS_AUTHORIZATION_TOKEN: "$PROMETHEUS_AUTHORIZATION_TOKEN"
      MAP_STORAGE_URL: "map-storage:50053"
      PUBLIC_MAP_STORAGE_URL: "http://map-storage.workadventure.localhost"
      INTERNAL_MAP_STORAGE_URL: "http://map-storage:3000"
      PLAYER_VARIABLES_MAX_TTL: $PLAYER_VARIABLES_MAX_TTL
      ENABLE_CHAT: "$ENABLE_CHAT"
      ENABLE_CHAT_UPLOAD: "$ENABLE_CHAT_UPLOAD"
      # Sentry integration
      SENTRY_DSN: ${SENTRY_DSN_BACK:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - .:/usr/src/app
      - workadventure-linux-node-modules:/usr/src/app/node_modules
    tmpfs: /tmp
    ports:
      - "9232:9229"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.back.rule=Host(`api.workadventure.localhost`)"
      - "traefik.http.routers.back.entryPoints=web"
      - "traefik.http.routers.back.service=back"
      - "traefik.http.services.back.loadbalancer.server.port=8080"

  map-storage:
    image: ghcr.io/thecodingmachine/nodejs:v2-24-trixie
    command: npm run start:dev
    #command: npm run profile
    working_dir: /usr/src/app/map-storage
    depends_on:
      node-modules-init:
        condition: service_completed_successfully
    environment:
      #DEBUG: "*"
      STARTUP_COMMAND_1: ../wait-proto.sh
      STARTUP_COMMAND_2: ../npm-install.sh
      NODE_ENV: development
      PROMETHEUS_AUTHORIZATION_TOKEN: "$PROMETHEUS_AUTHORIZATION_TOKEN"
      ENABLE_BASIC_AUTHENTICATION: "true"
      AUTHENTICATION_USER: "john.doe"
      AUTHENTICATION_PASSWORD: "password"
      ENABLE_BEARER_AUTHENTICATION: "true"
      AUTHENTICATION_TOKEN: "123"
      API_URL: back:50051
      # Sentry integration
      SENTRY_DSN: ${SENTRY_DSN_MAPSTORAGE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      PATH_PREFIX: ""
      MAP_STORAGE_API_TOKEN: "FFVSGBSGBSGFB23SFGBSFG4BS"
      PUSHER_URL: http://play.workadventure.localhost
      WHITELISTED_RESOURCE_URLS: ""
      SECRET_KEY: "$SECRET_KEY"
    volumes:
      - .:/usr/src/app
      - workadventure-linux-node-modules:/usr/src/app/node_modules
    tmpfs: /tmp
    ports:
      - "9233:9229"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.map-storage.rule=Host(`map-storage.workadventure.localhost`)"
      - "traefik.http.routers.map-storage.entryPoints=web"
      - "traefik.http.routers.map-storage.service=map-storage"
      - "traefik.http.services.map-storage.loadbalancer.server.port=3000"
      - "traefik.http.routers.map-storage-ui.rule=Host(`map-storage.workadventure.localhost`) && PathPrefix(`/ui/`)"
      - "traefik.http.routers.map-storage-ui.entryPoints=web"
      - "traefik.http.routers.map-storage-ui.service=map-storage-ui"
      - "traefik.http.services.map-storage-ui.loadbalancer.server.port=8080"

  uploader:
    image: ghcr.io/thecodingmachine/nodejs:v2-24-trixie
    command: npm run dev
    #command: npm run profile
    working_dir: /usr/src/app/uploader
    depends_on:
      node-modules-init:
        condition: service_completed_successfully
    environment:
      DEBUG: "*"
      STARTUP_COMMAND_1: ../npm-install.sh
      UPLOADER_URL: http://uploader.workadventure.localhost
      #AWS
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
      AWS_BUCKET: "${AWS_BUCKET:-}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-}"
      UPLOADER_AWS_SIGNED_URL_EXPIRATION: "${UPLOADER_AWS_SIGNED_URL_EXPIRATION:-}"
      #REDIS
      REDIS_HOST: "${UPLOADER_REDIS_HOST:-}"
      REDIS_PORT: "${UPLOADER_REDIS_PORT:-}"
      REDIS_DB_NUMBER: "${UPLOADER_REDIS_DB_NUMBER:-}"
      ENABLE_CHAT_UPLOAD: "$ENABLE_CHAT_UPLOAD"
      UPLOAD_MAX_FILESIZE: "${UPLOAD_MAX_FILESIZE:-}"
    volumes:
      - .:/usr/src/app
      - workadventure-linux-node-modules:/usr/src/app/node_modules
    tmpfs: /tmp
    ports:
      - "9234:9229"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uploader.rule=Host(`uploader.workadventure.localhost`)"
      - "traefik.http.routers.uploader.entryPoints=web"
      - "traefik.http.services.uploader.loadbalancer.server.port=8080"

  messages:
    image: ghcr.io/thecodingmachine/nodejs:v2-24-trixie-build
    environment:
      STARTUP_COMMAND_1: npm install
      STARTUP_COMMAND_2: npm run proto:watch
    volumes:
      - ./messages:/usr/src/app
      - ./back:/usr/src/back
      - ./play:/usr/src/play
      #- ./chat:/usr/src/chat
      - ./map-storage:/usr/src/map-storage
      - ./libs:/usr/src/libs

  redis:
    image: redis:6

  teapot-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: teapot
      POSTGRES_PASSWORD: teapot
      POSTGRES_DB: teapot
    volumes:
      - teapot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teapot -d teapot"]
      interval: 3s
      timeout: 3s
      retries: 20

  redisinsight:
    image: redislabs/redisinsight:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redisinsight.rule=Host(`redis.workadventure.localhost`)"
      - "traefik.http.routers.redisinsight.entryPoints=web"
      - "traefik.http.services.redisinsight.loadbalancer.server.port=8001"

  icon:
    image: matthiasluedtke/iconserver:v3.21.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.icon.rule=Host(`icon.workadventure.localhost`)"
      - "traefik.http.routers.icon.entryPoints=web"
      - "traefik.http.services.icon.loadbalancer.server.port=8080"

  # A mock server to test OpenID connect connectivity
  oidc-server-mock:
    image: ghcr.io/soluto/oidc-server-mock:0.7.0
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVER_OPTIONS_INLINE: |
        {
          "AccessTokenJwtType": "JWT",
          "Discovery": {
            "ShowKeySet": true
          },
          "Authentication": {
            "CookieSameSiteMode": "Lax",
            "CheckSessionCookieSameSiteMode": "Lax"
          }
        }
      LOGIN_OPTIONS_INLINE: |
        {
          "AllowRememberLogin": false
        }
      LOGOUT_OPTIONS_INLINE: |
        {
          "AutomaticRedirectAfterSignOut": true
        }
      API_SCOPES_INLINE: |
        - Name: tags
          UserClaims:
            - tags-scope
      API_RESOURCES_INLINE: |
        - Name: some-app
          Scopes:
            - some-app-scope-1
            - tags-scope
          UserClaims:
            - tags
      USERS_CONFIGURATION_INLINE: |
        [
          {
            "SubjectId":"1",
            "Username":"User1",
            "Password":"pwd",
            "Claims": [
              {
                "Type": "name",
                "Value": "John Doe",
                "ValueType": "string",
              },
              {
                "Type": "email",
                "Value": "john.doe@example.com",
                "ValueType": "string"
              },
              {
                "Type": "tags",
                "Value": "[\"admin\"]",
                "ValueType": "json"
              },
            ]
          },
          {
            "SubjectId":"2",
            "Username":"User2",
            "Password":"pwd",
            "Claims": [
              {
                "Type": "name",
                "Value": "Alice Doe",
                "ValueType": "string",
              },
              {
                "Type": "email",
                "Value": "alice.doe@example.com",
                "ValueType": "string"
              },
              {
                "Type": "tags",
                "Value": "[\"member\"]",
                "ValueType": "json"
              },
            ]
          },
          {
            "SubjectId":"3",
            "Username":"UserMatrix",
            "Password":"pwd",
            "Claims": [
              {
                "Type": "name",
                "Value": "John Doe",
                "ValueType": "string",
              },
              {
                "Type": "email",
                "Value": "john.doe@example.com",
                "ValueType": "string"
              },
              {
                "Type": "tags",
                "Value": "[\"admin\"]",
                "ValueType": "json"
              },
            ]
          }
        ]
      IDENTITY_RESOURCES_INLINE: |
        [
          {
            "Name": "tags-scope",
            "ClaimTypes": ["tags"]
          }
        ]
      CLIENTS_CONFIGURATION_PATH: /tmp/config/clients-config.json
    volumes:
      - ./contrib/oidc-server-mock:/tmp/config:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oidc.rule=Host(`oidc.workadventure.localhost`)"
      - "traefik.http.routers.oidc.entryPoints=web"
      - "traefik.http.routers.oidc.middlewares=auth-overlay-headers"
      # The mock login is displayed inside the Vite app's SSO overlay in local development.
      - "traefik.http.middlewares.auth-overlay-headers.headers.customresponseheaders.Content-Security-Policy="
      - "traefik.http.middlewares.auth-overlay-headers.headers.customresponseheaders.X-Content-Security-Policy="
      - "traefik.http.middlewares.auth-overlay-headers.headers.customresponseheaders.X-Frame-Options="
    healthcheck:
      #disable: true
      timeout: 5s
    # A mock server to test OpenID connect connectivity

  synapse:
    # Note: v1.141.0 introduces a breaking change in OIDC authentication in http with Webkit
    # See https://github.com/element-hq/synapse/pull/19309
    image: matrixdotorg/synapse:v1.140.0
    entrypoint: /data/start.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matrix.rule=Host(`matrix.workadventure.localhost`)"
      - "traefik.http.routers.matrix.entryPoints=web"
      - "traefik.http.services.matrix.loadbalancer.server.port=8008"
      - "traefik.http.routers.matrix.service=matrix"
      - "traefik.http.routers.matrix.middlewares=auth-overlay-headers"
    volumes:
      - ./synapse:/data/
      #- ./synapse/homeserver.template.yaml:/data/homeserver.template.yaml
      - ./synapse/federation:/etc/nginx/vhost.d/matrix.workadventure.localhost
    environment:
      VIRTUAL_HOST: "matrix.workadventure.localhost"
      VIRTUAL_PORT: 8008
      LETSENCRYPT_HOST: "matrix.workadventure.localhost"
      SYNAPSE_SERVER_NAME: "matrix.workadventure.localhost"
      SYNAPSE_REPORT_STATS: "yes"
      MATRIX_ADMIN_USER: admin
      MATRIX_ADMIN_PASSWORD: MySecretPassword
      JWT_SECRET: "$SECRET_KEY"

