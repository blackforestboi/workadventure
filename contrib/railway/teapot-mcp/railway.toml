[build]
builder = "DOCKERFILE"
dockerfilePath = "teapot-mcp/Dockerfile"
watchPatterns = ["/teapot-mcp/**", "/libs/**", "/messages/**", "/package.json", "/package-lock.json", "/contrib/railway/**"]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 20
drainingSeconds = 30
