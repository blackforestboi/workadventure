[build]
builder = "DOCKERFILE"
dockerfilePath = "map-storage/Dockerfile"
watchPatterns = ["/map-storage/**", "/libs/**", "/messages/**", "/package.json", "/package-lock.json", "/contrib/railway/**"]

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 20
drainingSeconds = 30
