[build]
builder = "DOCKERFILE"
dockerfilePath = "back/Dockerfile"
watchPatterns = ["/back/**", "/libs/**", "/messages/**", "/package.json", "/package-lock.json", "/contrib/railway/**"]

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 20
drainingSeconds = 30
